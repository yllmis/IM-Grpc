syntax = "proto3";

package operations;

option go_package = "./operations";

// ObservationQuery：正式内部观测契约，不包含业务对象查询。
// 只读边界：禁止 ExecuteSQL / ExecuteShell / Resend / Modify / Delete / KickUser。
service ObservationQuery {
  rpc GetMessageTimeline(GetMessageTimelineRequest) returns (GetMessageTimelineResponse);
  rpc GetDeliveryTimeline(GetDeliveryTimelineRequest) returns (GetDeliveryTimelineResponse);
  rpc GetConnectionObservations(GetConnectionObservationsRequest) returns (GetConnectionObservationsResponse);
  rpc GetCapabilities(GetCapabilitiesRequest) returns (GetCapabilitiesResponse);
}

// 只读观测契约；时间字段为 UnixNano，存在观测缺口时禁止返回 complete。

// ---------- MessageEvent / timeline ----------

message MessageEvent {
  string eventId = 1;
  int32 eventVersion = 2;
  string eventType = 3;
  string messageId = 4;
  string clientMessageId = 5;
  string correlationId = 6;
  string conversationId = 7;
  string senderId = 8;
  string receiverId = 9;
  string attemptId = 10;
  int64 occurredAt = 11; // UnixNano
  string source = 12;
  string errorCode = 13;
  int64 sequence = 14;
  map<string, string> metadata = 15;
}

message GetMessageTimelineRequest {
  string messageId = 1;
  int64 startTime = 2; // UnixNano，0=不限
  int64 endTime = 3;   // UnixNano，0=不限
  int32 limit = 4;
  string cursor = 5;
}

message GetMessageTimelineResponse {
  repeated MessageEvent events = 1;
  bool complete = 2;
  bool truncated = 3;
  string nextCursor = 4;
  string messageId = 5;
  string coverageStatus = 6; // complete | partial | unknown
  uint64 eventsDropped = 7;
}

// ---------- GetDeliveryTimeline ----------

message GetDeliveryTimelineRequest {
  string messageId = 1;
  string receiverId = 2; // 可选
  int32 limit = 3;
  string cursor = 4;
}

message DeliveryEvent {
  string eventId = 1;
  string eventType = 2; // delivery_* / receiver_offline / ack_*
  string messageId = 3;
  string receiverId = 4;
  string attemptId = 5;
  int64 occurredAt = 6; // UnixNano
  string source = 7;
  string errorCode = 8;
  map<string, string> metadata = 9;
  string evidence = 10; // gateway-write | transport-ack | offline-marker | legacy
}

message GetDeliveryTimelineResponse {
  repeated DeliveryEvent events = 1;
  bool complete = 2;
  bool truncated = 3;
  string nextCursor = 4;
  string messageId = 5;
  string coverageStatus = 6;
  uint64 eventsDropped = 7;
}

// ---------- GetConnectionObservations ----------

message GetConnectionObservationsRequest {
  string userId = 1;
  int64 at = 2;        // UnixNano 时间点；与时间范围互斥
  int64 startTime = 3; // UnixNano
  int64 endTime = 4;   // UnixNano
  int32 limit = 5;
  string cursor = 6;
  bool includeCurrent = 7;
}

message ConnectionObservation {
  string connectionId = 1;
  string instanceId = 2;
  string state = 3; // online | offline
  int64 observedAt = 4; // UnixNano
  string reason = 5;
}

message CurrentConnection {
  bool online = 1;
  string connectionId = 2;
  string instanceId = 3;
  int64 observedAt = 4; // UnixNano
  string source = 5;    // ws-conn-table | redis-login | unknown
}

message GetConnectionObservationsResponse {
  repeated ConnectionObservation observations = 1;
  CurrentConnection current = 2;
  bool complete = 3;
  bool truncated = 4;
  string nextCursor = 5;
  string note = 6;
  string coverageStatus = 7;
  uint64 eventsDropped = 8;
}

// ---------- GetCapabilities ----------

message GetCapabilitiesRequest {}

message GetCapabilitiesResponse {
  string messageSearch = 11; // 老服务未返回时客户端必须视为不支持
  string messageRecord = 1;
  string messageTimeline = 2;
  string deliveryEvents = 3;
  string historicalConnection = 4;
  string ackHistory = 5;
  string writeFailureEvents = 6;
  string readConfirmation = 7;
  int64 observedAt = 8; // UnixNano
  string observationEnabled = 9;
  string ackMode = 10;
}
